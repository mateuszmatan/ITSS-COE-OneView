<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/">
        <span class="brand-name"><strong>BBH</strong> {{ name }}</span>
      </a>
      @if (areas().length > 1) {
        <nav class="areas" aria-label="Areas">
          @for (item of areas(); track item.key) {
            <a
              class="area-link"
              [class.active]="item === area()"
              [attr.aria-current]="item === area() ? 'true' : null"
              [routerLink]="item.sections[0].path"
              >{{ item.label }}</a
            >
          }
        </nav>
      }
      <nav class="menu" aria-label="Main">
        @for (section of area().sections; track section.path) {
          <a
            class="menu-link"
            [routerLink]="section.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            >{{ section.label }}</a
          >
        }
      </nav>
      @if (user(); as user) {
        <div class="user-badge" [title]="user.email ?? user.displayName">
          <span class="user-name">{{ user.displayName }}</span>
          @if (user.admin) {
            <span class="user-role">Administrator</span>
          }
        </div>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span>BBH 2026</span>
  </footer>
</div>
